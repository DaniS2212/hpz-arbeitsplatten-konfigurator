name: Dekor-Browser-Belastungstest
on:
  pull_request:
    paths:
      - 'local/**'
      - 'design/**'
      - 'wordpress/hpz-apl-admin-preview/**'
      - 'wordpress/serve-package-test.mjs'
      - 'wordpress/stability-browser-test.mjs'
      - 'wordpress/stability-ci-runner.mjs'
      - 'wordpress/ui063-browser-runner.mjs'
      - 'wordpress/live-price-browser-runner.mjs'
      - 'wordpress/invalid-measures-browser-runner.mjs'
      - '.github/workflows/decor-browser-stress.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  decor-stress:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.1-noble
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Use preinstalled Chromium in matching official Playwright container
        run: npm install --no-save --no-package-lock playwright@1.55.1
      - name: Browser stress at desktop/mobile widths
        run: node wordpress/stability-ci-runner.mjs
      - name: Küchenstudio 0.6.3 checkout summary, vertical labels, responsive finish
        run: node wordpress/ui063-browser-runner.mjs
      - name: "Live-WordPress-AJAX: drawing stays responsive on stalled and cancelled prices"
        run: node wordpress/live-price-browser-runner.mjs
      - name: Invalid measurements preserve the last valid drawing
        run: node wordpress/invalid-measures-browser-runner.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hpz-studio-063-browser-screenshots
          path: wordpress/ci-artifacts/*.png
          if-no-files-found: ignore
          retention-days: 7
