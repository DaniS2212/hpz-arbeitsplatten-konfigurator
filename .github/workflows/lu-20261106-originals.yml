name: L/U 2250mm Speedmaster original screenshot archive
on:
  pull_request:
    paths:
      - 'docs/references/speedmaster-lu/Speedmaster_L1_U1_2250_UI_20261106_Originale.zip'
      - 'docs/references/speedmaster-lu/L1_U1_2250_SOURCE_MANIFEST.csv'
      - 'docs/references/speedmaster-lu/L1_U1_2250_PRICE_20261106.json'
      - 'scripts/verify_lu_20261106_archive.py'
      - '.github/workflows/lu-20261106-originals.yml'
  workflow_dispatch:

jobs:
  verify-original-pngs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Require exact 4 user PNG originals and all SHA256 checks
        run: python3 scripts/verify_lu_20261106_archive.py --require
