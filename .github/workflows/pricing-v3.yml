name: Price V3 Regression
on:
  pull_request:
    paths:
      - 'pricing-v3/**'
      - 'docs/price-v3-reference-checks.csv'
      - 'wordpress/**'
      - 'local/**'
      - 'build-plugin.mjs'
      - '.github/workflows/pricing-v3.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  php-price:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: php -l pricing-v3/HPZ_APL_Price_V3.php && php -l pricing-v3/tests/run.php
      - name: Price and margin regression
        run: php pricing-v3/tests/run.php
      - name: Straight sale readiness, price integrity, supplier and shipping proof checks
        run: php -l pricing-v3/HPZ_APL_Straight_Sale_Readiness.php && php pricing-v3/tests/sale-readiness.php
      - name: "Woo 0.8 draft cart: classic, Store API, coupons and manual supplier order"
        run: |
          php -l wordpress/checkout-v08/HPZ_APL_WC_Cart_Bridge.php
          php -l wordpress/checkout-v08/HPZ_APL_WC_Dormant_Hooks.php
          php wordpress/checkout-v08/tests/simple-101.php
          php wordpress/checkout-v08/tests/simple-101-hooks.php
      - name: "WP 0.9: no guest access, double release gate, supplier proofs and shipping/VAT"
        run: |
          php -l wordpress/sale-launch-090/HPZ_APL_WP_Supplier_Proofs.php
          php -l wordpress/sale-launch-090/HPZ_APL_WP_Woo_Context.php
          php -l wordpress/sale-launch-090/HPZ_APL_WP_Straight_Runtime.php
          php -l wordpress/hpz-apl-admin-preview/hpz-apl-admin-preview.php
          php wordpress/sale-launch-090/tests/disabled.php
      - name: Version 1.0 supplier proof admin input validation
        run: php -l wordpress/sale-launch-100/HPZ_APL_WP_Proof_Admin.php && php wordpress/sale-launch-100/tests/admin-input.php
      - name: PHP preview syntax and security
        run: |
          php -l wordpress/hpz-apl-admin-preview/hpz-apl-admin-preview.php
          php -l wordpress/hpz-apl-admin-preview/includes/price-v3.php
          php -l wordpress/hpz-apl-admin-preview/includes/price-preview.php
          php wordpress/price-preview.test.php
          php wordpress/price-ajax.test.php
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Component and HTTP integration regression
        env:
          HPZ_PHP_BIN: php
        run: node --test local/test/*.test.mjs wordpress/*.test.mjs
