name: HPZ Arbeitsplatten – geprüfter Auto-Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/hpz-auto-deploy.yml'
      - 'scripts/deploy/**'
  workflow_dispatch:

permissions:
  contents: read

# Never interrupt a running live deployment; PR runs do not block production.
concurrency:
  group: hpz-apl-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'production' }}
  cancel-in-progress: false

jobs:
  verify-php:
    name: PHP and WooCommerce regression
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Syntax of all deployed PHP
        shell: bash
        run: |
          set -euo pipefail
          find wordpress/hpz-apl-admin-preview pricing-v3 wordpress/checkout-v08 wordpress/sale-launch-090 wordpress/sale-launch-100 -name '*.php' -type f -print0 |
            xargs -0 -n 1 php -l > /dev/null
      - name: V3, WooCommerce, WordPress and decor regression
        run: |
          php pricing-v3/tests/run.php
          php pricing-v3/tests/sale-readiness.php
          php wordpress/checkout-v08/tests/simple-101.php
          php wordpress/checkout-v08/tests/simple-101-hooks.php
          php wordpress/sale-launch-090/tests/disabled.php
          php wordpress/sale-launch-100/tests/admin-input.php
          php wordpress/price-preview.test.php
          php wordpress/price-ajax.test.php
          php wordpress/top-cta.test.php
          php wordpress/decor-catalog.test.php
          php wordpress/admin-supplier-decor.test.php
          php -l wordpress/real-site-tests/preflight.php

  verify-node:
    name: Node + package + deployment safeguards
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Component, network regression and deploy rollback tests
        env:
          HPZ_PHP_BIN: php
        run: node --test local/test/*.test.mjs wordpress/*.test.mjs scripts/deploy/tests/*.test.mjs
      - name: Remote script syntax
        run: bash -n scripts/deploy/remote-deploy.sh

  verify-browser:
    name: Chromium desktop/mobile smoke regression
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.1-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Matching Playwright binary
        run: npm install --no-save --no-package-lock playwright@1.55.1
      - name: Main browser regression
        run: |
          node wordpress/stability-ci-runner.mjs
          node wordpress/ui063-browser-runner.mjs
          node wordpress/live-price-browser-runner.mjs
          node wordpress/invalid-measures-browser-runner.mjs

  package:
    name: Build unique, reviewed plugin ZIP
    needs: [verify-php, verify-node, verify-browser]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      version: ${{ steps.zip.outputs.version }}
      sha: ${{ steps.zip.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check generated resources exactly match approved source
        run: |
          node build-plugin.mjs
          git diff --exit-code -- wordpress/hpz-apl-admin-preview
      - name: Stamp immutable CI build and rebuild cache-busted assets
        run: |
          node scripts/deploy/stamp-ci-version.mjs wordpress/hpz-apl-admin-preview/hpz-apl-admin-preview.php "$GITHUB_RUN_NUMBER"
          node build-plugin.mjs
          php -l wordpress/hpz-apl-admin-preview/hpz-apl-admin-preview.php
      - name: ZIP integrity and checksum
        id: zip
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^ \* Version: \([0-9.]*\)$/\1/p' wordpress/hpz-apl-admin-preview/hpz-apl-admin-preview.php)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]
          mkdir -p dist
          (cd wordpress && zip -qr "../dist/hpz-apl-admin-preview-$version.zip" hpz-apl-admin-preview)
          unzip -tqq "dist/hpz-apl-admin-preview-$version.zip"
          sha=$(sha256sum "dist/hpz-apl-admin-preview-$version.zip" | cut -d' ' -f1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: hpz-apl-tested-wordpress-plugin
          path: dist/hpz-apl-admin-preview-*.zip
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: HostPress update with backup and automatic rollback
    needs: [package]
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      vars.HPZ_AUTO_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: hpz-apl-tested-wordpress-plugin
          path: dist
      - name: Upload and deploy the exact tested ZIP over pinned-key SSH
        shell: bash
        env:
          SSH_HOST: ${{ secrets.HPZ_WP_SSH_HOST }}
          SSH_USER: ${{ secrets.HPZ_WP_SSH_USER }}
          SSH_PORT: ${{ secrets.HPZ_WP_SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.HPZ_WP_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.HPZ_WP_SSH_KNOWN_HOSTS }}
          WP_ROOT: ${{ secrets.HPZ_WP_PATH }}
          VERSION: ${{ needs.package.outputs.version }}
          EXPECTED_SHA: ${{ needs.package.outputs.sha }}
        run: |
          set -euo pipefail
          for field in SSH_HOST SSH_USER SSH_PRIVATE_KEY SSH_KNOWN_HOSTS WP_ROOT VERSION EXPECTED_SHA; do
            [[ -n "${!field:-}" ]] || { echo "Missing GitHub secret or output: $field" >&2; exit 2; }
          done
          [[ "$SSH_HOST" =~ ^[A-Za-z0-9.-]+$ && "$SSH_USER" =~ ^[A-Za-z0-9_-]+$ ]] || exit 2
          [[ "$WP_ROOT" =~ ^/[A-Za-z0-9_./-]+$ && "$WP_ROOT" != *..* ]] || exit 2
          SSH_PORT="${SSH_PORT:-22}"
          [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]] && (( 10#$SSH_PORT > 0 && 10#$SSH_PORT < 65536 )) || exit 2
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 2
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{64}$ ]] || exit 2
          ZIP="dist/hpz-apl-admin-preview-$VERSION.zip"
          [[ -f "$ZIP" ]] || exit 2
          printf '%s  %s\n' "$EXPECTED_SHA" "$ZIP" | sha256sum --check --status
          ssh_dir="$RUNNER_TEMP/hpz-ssh"
          mkdir -m 700 -p "$ssh_dir"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$ssh_dir/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/id_ed25519" "$ssh_dir/known_hosts"
          host_lookup="$SSH_HOST"
          if [[ "$SSH_PORT" != 22 ]]; then host_lookup="[$SSH_HOST]:$SSH_PORT"; fi
          ssh-keygen -F "$host_lookup" -f "$ssh_dir/known_hosts" >/dev/null || { echo 'Pinned SSH host key not configured for this host/port.' >&2; exit 2; }
          ssh_args=(-i "$ssh_dir/id_ed25519" -p "$SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$ssh_dir/known_hosts" -o ConnectTimeout=15)
          scp_args=(-i "$ssh_dir/id_ed25519" -P "$SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$ssh_dir/known_hosts" -o ConnectTimeout=15)
          target="$SSH_USER@$SSH_HOST"
          archive="hpz-apl-admin-preview-ci${GITHUB_RUN_ID}-${GITHUB_SHA:0:12}.zip"
          ssh "${ssh_args[@]}" "$target" 'umask 077; mkdir -p "$HOME/.hpz-apl-deploy/incoming"; chmod 700 "$HOME/.hpz-apl-deploy" "$HOME/.hpz-apl-deploy/incoming"'
          scp "${scp_args[@]}" "$ZIP" "$target:.hpz-apl-deploy/incoming/$archive"
          ssh "${ssh_args[@]}" "$target" "bash -s -- '$WP_ROOT' '$archive' '$EXPECTED_SHA' '$VERSION'" < scripts/deploy/remote-deploy.sh
